services:
  # PostgreSQL Database with JSONB & Full-Text Search
  postgres:
    image: postgres:16-alpine
    container_name: formgenius-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: formgenius
      POSTGRES_USER: formgenius
      POSTGRES_PASSWORD: formgenius_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formgenius -d formgenius"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - formgenius-network

  # Spring Boot 3.4 / Java 21 Backend API Service
  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    container_name: formgenius-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/formgenius
      SPRING_DATASOURCE_USERNAME: formgenius
      SPRING_DATASOURCE_PASSWORD: formgenius_secret
      JWT_SECRET: c2VjdXJla2V5MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
      JWT_EXPIRATION_MS: 86400000
      JWT_REFRESH_EXPIRATION_MS: 604800000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-demo-key}
      APP_CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - formgenius-network

  # React 19 / Vite / Nginx Frontend Application
  frontend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.frontend
    container_name: formgenius-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - formgenius-network

networks:
  formgenius-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
